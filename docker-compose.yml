version: '3.9'

services:
    auth-service:
        image: kovryzhko-clinic/auth-service
        container_name: auth-service
        build:
            context: ./
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - .env.production.local
        expose:
            - 9101
        networks:
            - kovryzhko-clinic

networks:
    kovryzhko-clinic:
        external: true
